name: ShopCart
options:
  bundleIdPrefix: edu.khpi.qa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  ShopCart:
    type: application
    platform: iOS
    sources: [ShopCart]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.khpi.qa.ShopCart
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ShopCartTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ShopCartTests]
    dependencies:
      - target: ShopCart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.khpi.qa.ShopCartTests
  ShopCartUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShopCartUITests]
    dependencies:
      - target: ShopCart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.khpi.qa.ShopCartUITests
schemes:
  ShopCart:
    build:
      targets:
        ShopCart: all
    test:
      gatherCoverageData: true
      coverageTargets: [ShopCart]
      targets:
        - ShopCartTests
        - ShopCartUITests
